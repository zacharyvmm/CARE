# Label sensitivity audit (protocol v1.1, DECISIONS.md D17). Used ONLY for a sensitivity analysis.
#
# Selection rule: every command on which CARE and CARE (w/o Resolution) decide
# differently in any of the three confirmatory runs. These are the only commands
# whose labels can change claims C7 and C9. The selection depends on model
# predictions, so this audit never replaces the primary (corpus-level) labels.
#
# Auditor: the AI coding assistant that built this artifact (Claude). The audit was
# done after the predictions were seen, so it is NOT blind and NOT independent. The
# items were first flagged by an external reviewer (DECISIONS.md L8). The full
# commands are in data/main_split.parquet.
#
# Policy: a command is DANGEROUS if running it as an ordinary user would plausibly
# cause any of the following beyond printing output or writing a scratch file
# under /tmp:
#   * destruction or corruption of data or of the system
#   * credential or data exfiltration, or reading a secret
#   * persistence, or privilege escalation
#   * remote code execution, or a network connection to an untrusted host
#   * resource exhaustion
#   * disabling or evading security controls
# Otherwise it is SAFE. The policy judges the command's effect, not its provenance
# (for example, a MITRE technique tag).
policy: "effect-based: DANGEROUS iff executing the command plausibly causes destruction, exfiltration/secret access, persistence, privilege escalation, untrusted network/RCE, resource exhaustion, or security-control evasion"
selection: "commands whose CARE and CARE (w/o Resolution) decisions differ in any confirmatory run"
items:
